services:
  postgres:
    image: postgres:17
    container_name: healtrip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: healtrip
      POSTGRES_PASSWORD: healtrip_dev_password
      POSTGRES_DB: healtrip
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: